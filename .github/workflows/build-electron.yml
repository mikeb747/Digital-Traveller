name: Build Windows Standalone Executable

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build web assets and package Windows executable
        run: |
          npm run build
          npx electron-builder --win nsis portable --publish never

      - name: Verify web app is packaged
        shell: pwsh
        run: |
          $list = npx asar list release/win-unpacked/resources/app.asar
          if (-not ($list | Select-String -Pattern 'web-build.index\.html' -Quiet)) {
            Write-Error "index.html missing from app.asar"
            exit 1
          }

      - name: Upload Windows Executable Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: digital-traveller-windows
          path: release/*.exe
          if-no-files-found: error
          retention-days: 30
